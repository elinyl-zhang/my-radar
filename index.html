<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Radar · Personal Intelligence System</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='none' stroke='%23993556' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%23993556' stroke-width='1.5' opacity='.45'/%3E%3Ccircle cx='32' cy='32' r='9' fill='none' stroke='%23993556' stroke-width='1' opacity='.3'/%3E%3Ccircle cx='32' cy='32' r='3' fill='%23993556'/%3E%3Cline x1='32' y1='32' x2='32' y2='6' stroke='%23993556' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='24' cy='16' r='2.5' fill='%233B5998'/%3E%3Ccircle cx='42' cy='22' r='2' fill='%23B07333'/%3E%3Ccircle cx='20' cy='40' r='2' fill='%234A6741'/%3E%3Ccircle cx='44' cy='44' r='2' fill='%236B4C7A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F2ED;
    --bg-alt: #EDE9E1;
    --bg-dark: #1A1A1C;
    --text: #2A2A2A;
    --text-muted: #57534D;
    --text-light: #7C766D;
    --text-on-dark: #E8E4DD;
    --text-on-dark-muted: #8A8580;
    --accent: #993556;
    --accent-soft: rgba(153,53,86,0.08);
    --border: #D9D4CB;
    --border-light: #E8E3DA;
    --white: #FFFFFF;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', -apple-system, 'SF Pro Text', sans-serif;
    --mono: 'SF Mono', 'JetBrains Mono', monospace;
    --rail-w: 72px;
    --panel-w: 380px;
    /* Six editorial section colors */
    --world: #993556;
    --think: #3B5998;
    --look: #4A6741;
    --discover: #6B4C7A;
    --explore: #B07333;
    --make: #1A1A1C;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    font-family:var(--sans); background:var(--bg); color:var(--text);
    line-height:1.7; font-size:15px; font-weight:400;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }

  /* === LEFT RAIL === */
  .rail {
    position:fixed; left:0; top:0; bottom:0; width:var(--rail-w);
    background:var(--bg-dark); display:flex; flex-direction:column;
    align-items:center; padding:28px 0 20px; z-index:50; gap:6px;
  }
  .rail-logo {
    width:28px; height:28px; margin-bottom:28px; opacity:0.6;
  }
  .rail-item {
    display:flex; flex-direction:column; align-items:center; gap:4px;
    cursor:pointer; text-decoration:none; padding:10px 0; width:100%;
    border-left:2px solid transparent; transition:border-color 0.2s, opacity 0.2s;
    opacity:0.4;
  }
  .rail-item.active, .rail-item:hover { opacity:1; border-left-color:var(--accent); }
  .rail-icon {
    width:18px; height:18px; display:block; color:var(--text-on-dark);
  }
  .rail-label {
    font-family:var(--mono); font-size:8px; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--text-on-dark-muted); text-align:center;
  }
  .rail-item.active .rail-label { color:var(--text-on-dark); }

  /* === CENTER AREA === */
  .center {
    position:fixed; left:var(--rail-w); top:0; bottom:0;
    right:var(--panel-w); overflow-y:auto; overflow-x:hidden;
  }
  .center-inner {
    max-width:820px; margin:0 auto; padding:0 48px;
  }

  /* --- greeting --- */
  .greeting {
    padding:44px 0 12px;
  }
  .greeting-kicker {
    font-family:var(--mono); font-size:10px; letter-spacing:0.22em;
    text-transform:uppercase; color:var(--text-light); margin-bottom:6px;
  }
  .greeting-line {
    font-family:var(--serif); font-size:clamp(28px,4.5vw,38px);
    font-weight:600; color:var(--text); letter-spacing:-0.02em; line-height:1.15;
  }
  .greeting-meta {
    font-family:var(--mono); font-size:11px; color:var(--text-light);
    letter-spacing:0.04em; margin-top:8px;
  }
  .greeting-meta span { color:var(--accent); font-weight:600; }

  /* --- landscape header --- */
  .ls-header {
    margin-top:44px; padding-bottom:16px; border-bottom:1px solid var(--border);
  }
  .ls-title {
    font-family:var(--serif); font-size:22px; font-weight:600;
    color:var(--text); letter-spacing:-0.01em;
  }
  .ls-subtitle {
    font-family:var(--mono); font-size:10px; letter-spacing:0.16em;
    text-transform:uppercase; color:var(--text-light); margin-top:4px;
  }

  /* --- landscape SVG --- */
  .ls-scroll { overflow-x:auto; margin-top:8px; }
  .ls-svg { display:block; width:100%; min-width:640px; height:auto; }
  .ls-territory { stroke-dasharray:3 5; }
  .ls-territory-label { font-family:var(--mono); font-size:10px; letter-spacing:0.18em; text-transform:uppercase; text-anchor:middle; }
  .ls-spoke { stroke:var(--border); stroke-dasharray:2 6; }
  .ls-edge { stroke-width:1; opacity:0.28; stroke-dasharray:4 3; }
  .ls-you-ring { fill:none; stroke:var(--accent); stroke-dasharray:2 4; opacity:0.55; }
  .ls-you-dot { fill:var(--accent); }
  .ls-you-label { font-family:var(--mono); font-size:9px; letter-spacing:0.2em; fill:var(--accent); text-anchor:middle; }
  .ls-node { cursor:pointer; outline:none; }
  .ls-dot { }
  .ls-dot-ring { opacity:0.4; }
  .ls-node-label { font-family:var(--mono); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; text-anchor:middle; }
  .ls-node:hover .ls-node-label, .ls-node:focus-visible .ls-node-label { font-weight:600; opacity:0.85; }
  .ls-node:hover .ls-dot, .ls-node:focus-visible .ls-dot { stroke-width:2; }
  .ls-strong .ls-node-label { font-weight:600; font-size:11px; }

  /* --- bottom sections --- */
  .bottom-sections { margin-top:48px; padding-bottom:64px; }
  .kicker-label {
    display:block; font-family:var(--mono); font-size:9px; font-weight:600;
    letter-spacing:0.2em; text-transform:uppercase; margin-bottom:10px;
  }
  .pattern-block { padding-top:24px; border-top:1px solid var(--border); }
  .pattern-statement {
    font-family:var(--serif); font-size:22px; font-weight:500;
    line-height:1.42; color:var(--text); max-width:28em; margin-bottom:16px;
  }
  .pattern-contrib {
    display:flex; align-items:baseline; gap:12px; padding:9px 0;
    border-top:1px dashed var(--border-light);
  }
  .pattern-contrib:first-of-type { border-top:none; }
  .pc-num { font-family:var(--mono); font-size:10px; }
  .pc-head {
    font-family:var(--serif); font-size:15px; font-weight:600;
    color:var(--text); background:none; border:none; padding:0;
    cursor:pointer; text-align:left;
  }
  .pc-head:hover { opacity:0.7; }
  .pc-dom {
    margin-left:auto; font-family:var(--mono); font-size:9px;
    letter-spacing:0.1em; text-transform:uppercase; color:var(--text-light); white-space:nowrap;
  }

  .question-block { margin-top:44px; padding:6px 0 6px 22px; border-left:3px solid #B07333; }
  .question-text {
    font-family:var(--serif); font-style:italic; font-size:21px;
    line-height:1.45; color:var(--text); max-width:26em;
  }

  /* --- timeline --- */
  .timeline-block { margin-top:44px; padding-top:24px; border-top:1px solid var(--border); }
  .timeline-row {
    display:flex; align-items:baseline; gap:12px; padding:8px 0;
    border-bottom:1px solid var(--border-light);
  }
  .tl-date { font-family:var(--mono); font-size:10px; color:var(--text-light); white-space:nowrap; min-width:70px; }
  .tl-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; margin-top:4px; }
  .tl-headline { font-size:13px; color:var(--text-muted); cursor:pointer; }
  .tl-headline:hover { color:var(--text); }
  .tl-domain { font-family:var(--mono); font-size:9px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-light); margin-left:auto; white-space:nowrap; }

  /* === RIGHT DETAIL PANEL === */
  .detail-panel {
    position:fixed; right:0; top:0; bottom:0; width:var(--panel-w);
    background:var(--bg); border-left:1px solid var(--border);
    overflow-y:auto; z-index:40; padding:36px 28px 48px;
    transition:opacity 0.2s;
  }
  .detail-panel.empty { opacity:0.45; }
  .dp-empty {
    font-family:var(--mono); font-size:11px; color:var(--text-light);
    letter-spacing:0.06em; text-transform:uppercase;
    text-align:center; margin-top:40vh;
  }
  .dp-kicker {
    font-family:var(--mono); font-size:9px; letter-spacing:0.16em;
    text-transform:uppercase; margin-bottom:10px;
  }
  .dp-headline {
    font-family:var(--serif); font-size:22px; font-weight:600;
    line-height:1.22; color:var(--text); margin-bottom:8px;
  }
  .dp-oneliner {
    font-size:14px; line-height:1.55; color:var(--text-muted); margin-bottom:20px;
  }
  .dp-block {
    padding:12px 0 4px; border-top:1px solid var(--border-light); margin-top:12px;
  }
  .dp-text { font-size:13px; line-height:1.6; color:var(--text-muted); }
  .dp-chain {
    font-family:var(--mono); font-size:10px; letter-spacing:0.06em;
    text-transform:uppercase; color:var(--text); margin-bottom:6px;
  }
  .dp-chain .dp-node { white-space:nowrap; }
  .dp-chain .dp-dash { margin:0 6px; }
  .dp-conn { font-size:12px; line-height:1.55; color:var(--text-muted); padding:6px 0; }
  .dp-conn-to {
    display:block; font-family:var(--mono); font-size:9px;
    letter-spacing:0.08em; text-transform:uppercase; margin-bottom:2px;
  }
  .dp-source { font-size:12px; color:var(--text-light); line-height:1.55; margin-bottom:10px; }
  .dp-link {
    font-family:var(--mono); font-size:10px; letter-spacing:0.12em;
    text-transform:uppercase; text-decoration:none; border-bottom:1px solid; padding-bottom:2px;
  }
  .dp-link:hover { opacity:0.75; }
  .dp-action {
    margin-top:16px; padding:14px 16px; background:var(--bg-alt);
    border-left:2px solid var(--accent); border-radius:0 4px 4px 0;
    font-size:13px; line-height:1.55; color:var(--text-muted);
  }
  .dp-action-label {
    font-family:var(--mono); font-size:9px; font-weight:600;
    letter-spacing:0.1em; text-transform:uppercase; color:var(--accent);
    display:block; margin-bottom:4px;
  }

  /* === RESPONSIVE === */
  @media (max-width:1100px) {
    :root { --panel-w:320px; }
  }
  @media (max-width:860px) {
    :root { --panel-w:0px; }
    .detail-panel { display:none; }
    /* show overlay panel instead */
    .detail-panel.mobile-show {
      display:block; position:fixed; left:0; width:100%; z-index:90;
      background:var(--bg); padding:24px 20px 36px;
    }
  }
  @media (max-width:640px) {
    :root { --rail-w:0px; }
    .rail { display:none; }
    .center-inner { padding:0 20px; }
  }

  /* ============================================================
     SIX EDITORIAL WINDOWS — WORLD/THINK/LOOK/DISCOVER/EXPLORE/MAKE
     ============================================================ */
  .editorial-windows { margin-top:48px; padding-bottom:12px; }
  .ew-section { margin-top:40px; padding-top:24px; border-top:1px solid var(--border-light); }
  .ew-section:first-child { margin-top:0; border-top:none; }
  .ew-label {
    font-family:var(--serif); font-size:15px; font-weight:600; letter-spacing:0.08em;
    text-transform:uppercase; margin-bottom:14px;
  }
  .ew-section--world .ew-label { color:var(--world); border-left:3px solid var(--world); padding-left:10px; }
  .ew-section--think .ew-label { color:var(--think); border-left:3px solid var(--think); padding-left:10px; }
  .ew-section--look .ew-label { color:var(--look); border-left:3px solid var(--look); padding-left:10px; }
  .ew-section--discover .ew-label { color:var(--discover); border-left:3px solid var(--discover); padding-left:10px; }
  .ew-section--explore .ew-label { color:var(--explore); border-left:3px solid var(--explore); padding-left:10px; }
  .ew-section--make .ew-label { color:var(--make); border-left:3px solid var(--make); padding-left:10px; }

  /* WORLD */
  .ew-world-item { margin-bottom:20px; }
  .ew-world-item:last-child { margin-bottom:0; }
  .ew-world-head { font-family:var(--serif); font-size:17px; font-weight:600; line-height:1.3; color:var(--text); cursor:pointer; }
  .ew-world-head:hover { opacity:0.75; }
  .ew-world-sub { font-size:13px; color:var(--text-muted); margin-top:3px; line-height:1.5; }
  .ew-world-why { font-size:11px; color:var(--text-light); margin-top:3px; }
  .ew-world-why::before { content:'Why → '; font-family:var(--mono); font-size:9px; letter-spacing:0.04em; color:var(--world); }
  .ew-world-src { font-family:var(--mono); font-size:9px; letter-spacing:0.02em; margin-top:2px; }
  .ew-world-src a { color:var(--world); }

  /* THINK */
  .ew-think-item { margin-bottom:32px; }
  .ew-think-item:last-child { margin-bottom:0; }
  .ew-think-concept { font-family:var(--mono); font-size:9px; letter-spacing:0.1em; text-transform:uppercase; color:var(--think); margin-bottom:8px; }
  .ew-think-question { font-family:var(--serif); font-size:20px; font-style:italic; font-weight:400; line-height:1.3; color:var(--text); }
  .ew-think-explain { font-size:13px; color:var(--text-muted); margin-top:14px; line-height:1.6; }
  .ew-think-why { font-size:12px; color:var(--text); margin-top:10px; line-height:1.55; }
  .ew-think-why::before { content:'Why this matters — '; font-family:var(--mono); font-size:9px; letter-spacing:0.04em; color:var(--think); }
  .ew-think-conn { font-size:11px; color:var(--text-muted); margin-top:4px; line-height:1.5; }
  .ew-think-conn::before { content:'For you — '; font-family:var(--mono); font-size:9px; letter-spacing:0.04em; color:var(--think); }
  .ew-think-src { font-family:var(--mono); font-size:9px; margin-top:6px; }
  .ew-think-src a { color:var(--think); }

  /* LOOK */
  .ew-look-image { width:100%; height:280px; object-fit:cover; margin-bottom:16px; background:var(--bg-alt); display:flex; align-items:center; justify-content:center; }
  .ew-look-image-placeholder { font-family:var(--mono); font-size:9px; color:var(--text-light); letter-spacing:0.04em; }
  .ew-look-subject { font-family:var(--serif); font-size:19px; font-weight:600; line-height:1.25; color:var(--text); }
  .ew-look-subtitle { font-size:12px; color:var(--text-muted); margin-top:2px; }
  .ew-look-why { font-size:12px; color:var(--text-muted); margin-top:10px; line-height:1.55; }
  .ew-look-why::before { content:'Why today — '; font-family:var(--mono); font-size:9px; letter-spacing:0.04em; color:var(--look); }
  .ew-look-for-label { font-family:var(--mono); font-size:9px; letter-spacing:0.08em; text-transform:uppercase; color:var(--look); margin-top:12px; margin-bottom:6px; }
  .ew-look-for-list li { font-size:12px; color:var(--text); padding-left:16px; position:relative; margin-bottom:4px; line-height:1.5; }
  .ew-look-for-list li::before { content:'→'; position:absolute; left:0; color:var(--look); }
  .ew-look-visit { font-family:var(--mono); font-size:9px; letter-spacing:0.04em; margin-top:10px; }
  .ew-look-visit a { color:var(--look); }

  /* DISCOVER */
  .ew-discover-layout { display:flex; gap:20px; align-items:flex-start; }
  .ew-discover-portrait { flex:0 0 auto; width:120px; height:150px; object-fit:cover; background:var(--bg-alt); display:flex; align-items:center; justify-content:center; }
  .ew-discover-portrait-placeholder { font-family:var(--mono); font-size:8px; color:var(--text-light); }
  .ew-discover-body { flex:1 1 auto; min-width:0; }
  .ew-discover-name { font-family:var(--serif); font-size:18px; font-weight:600; line-height:1.2; color:var(--text); }
  .ew-discover-roles { font-family:var(--mono); font-size:9px; letter-spacing:0.06em; text-transform:uppercase; color:var(--discover); margin-top:5px; }
  .ew-discover-desc { font-size:12px; color:var(--text-muted); margin-top:10px; line-height:1.55; }
  .ew-discover-why { font-size:12px; color:var(--text); margin-top:10px; line-height:1.55; }
  .ew-discover-why::before { content:'Why her — '; font-family:var(--mono); font-size:9px; letter-spacing:0.04em; color:var(--discover); }
  .ew-discover-tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .ew-discover-tag { font-family:var(--mono); font-size:8px; letter-spacing:0.04em; padding:2px 8px; border:1px solid var(--border-light); color:var(--text-light); border-radius:2px; }
  .ew-discover-link { font-family:var(--mono); font-size:9px; margin-top:10px; }
  .ew-discover-link a { color:var(--discover); }

  /* EXPLORE */
  .ew-explore-question { font-family:var(--serif); font-size:16px; font-weight:500; line-height:1.35; color:var(--text); margin-bottom:8px; }
  .ew-explore-start { font-family:var(--mono); font-size:10px; letter-spacing:0.03em; margin-bottom:16px; }
  .ew-explore-start a { color:var(--explore); }
  .ew-explore-trail { position:relative; padding-left:16px; }
  .ew-explore-trail::before { content:''; position:absolute; left:3px; top:6px; bottom:6px; width:1px; background:var(--border-light); }
  .ew-explore-step { position:relative; margin-bottom:14px; padding-left:12px; }
  .ew-explore-step:last-child { margin-bottom:0; }
  .ew-explore-step::before { content:''; position:absolute; left:-12px; top:5px; width:4px; height:4px; border-radius:50%; background:var(--explore); opacity:0.5; }
  .ew-explore-step-title { font-family:var(--serif); font-size:13px; font-weight:500; line-height:1.35; color:var(--text); }
  .ew-explore-step-hint { font-size:11px; color:var(--text-muted); margin-top:2px; line-height:1.45; }
  .ew-explore-why { font-size:11px; color:var(--text-muted); margin-top:14px; line-height:1.55; }
  .ew-explore-why::before { content:'Why this rabbit hole — '; font-family:var(--mono); font-size:9px; letter-spacing:0.04em; color:var(--explore); }

  /* MAKE */
  .ew-make-tool { font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:0.02em; color:var(--make); }
  .ew-make-does { font-size:13px; color:var(--text); margin-top:5px; line-height:1.5; }
  .ew-make-why { font-size:11px; color:var(--text-muted); margin-top:5px; }
  .ew-make-why::before { content:'Why now — '; font-family:var(--mono); font-size:9px; letter-spacing:0.03em; color:var(--make); }
  .ew-make-try { font-size:11px; color:var(--text-muted); margin-top:6px; line-height:1.5; }
  .ew-make-try::before { content:'Try → '; font-family:var(--mono); font-size:9px; letter-spacing:0.03em; color:var(--make); }
  .ew-make-link { font-family:var(--mono); font-size:9px; margin-top:6px; }
  .ew-make-link a { color:var(--make); }
</style>
</head>
<body>

<!-- LEFT RAIL -->
<nav class="rail" aria-label="Navigation">
  <svg class="rail-logo" viewBox="0 0 28 28" fill="none">
    <circle cx="14" cy="14" r="12" stroke="#E8E4DD" stroke-width="1.5"/>
    <circle cx="14" cy="14" r="7" stroke="#E8E4DD" stroke-width="0.8" opacity="0.4"/>
    <circle cx="14" cy="14" r="2" fill="#993556"/>
    <line x1="14" y1="14" x2="14" y2="2" stroke="#993556" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
  <a class="rail-item active" data-view="today" href="javascript:void(0)" aria-label="Today">
    <svg class="rail-icon" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.2"/><line x1="9" y1="5" x2="9" y2="9" stroke="currentColor" stroke-width="1.2"/><line x1="9" y1="9" x2="12" y2="11" stroke="currentColor" stroke-width="1"/></svg>
    <span class="rail-label">Today</span>
  </a>
  <a class="rail-item" data-view="world" href="javascript:void(0)" aria-label="World">
    <svg class="rail-icon" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="3" fill="currentColor"/><circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2"/></svg>
    <span class="rail-label">Signals</span>
  </a>

      lbl.textContent=t.name;

    (feed.territories||[]).forEach(function(t){
      svgE('line',{'class':'ls-spoke',x1:t.x,y1:t.y,x2:YOU.x,y2:YOU.y},root);

    youLbl.textContent='YOU';

        var key=[s.id,c.to_signal].sort().join('|');

        svgE('line',{'class':'ls-edge',x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:dc(s.landscape.domain).dot},root);

      act.appendChild(el('span','dp-action-label','Suggested action'));
      act.appendChild(el('span','',esc(s.suggested_action)));
      panel.appendChild(act);
    }
  }
